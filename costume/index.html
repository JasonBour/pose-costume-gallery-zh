<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f8f9fc;--text:#171a21;--text-2:#5d6472;--text-3:#8a919f;
  --line:#e5e8ef;--line-strong:#d6dbe5;--accent:#137a70;--accent-dark:#0e6259;--accent-soft:#eaf6f4;
  --radius:14px;--shadow:0 10px 30px rgba(28,35,60,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* 顶栏 */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.top-in{width:min(1320px,calc(100% - 36px));margin-inline:auto;display:flex;align-items:center;gap:14px;height:56px}
.back{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;transition:.16s}
.back:hover{border-color:#bdc3d6;color:var(--text)}
.title{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.title i{font-style:normal;color:var(--text-3);font-weight:500;font-size:12.5px;margin-left:8px}
.spacer{flex:1}
.jump{font-size:13px;color:var(--accent);font-weight:650}
.jump:hover{text-decoration:underline}

/* 标题区 */
.intro{width:min(1320px,calc(100% - 36px));margin-inline:auto;padding:26px 0 4px}
h1{margin:0;font-size:clamp(23px,3.4vw,32px);line-height:1.2;letter-spacing:-.03em;font-weight:800}
.lede{margin:9px 0 0;color:var(--text-2);font-size:13.5px;line-height:1.8;max-width:720px;text-wrap:pretty}

/* 筛选栏 */
.filters{position:sticky;top:56px;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-top:18px}
.filters-in{width:min(1320px,calc(100% - 36px));margin-inline:auto;padding:11px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;row-gap:6px;padding-bottom:2px}
.chip{flex:none;height:31px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:#c2c8d8;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{font-weight:650;opacity:.62;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on b{opacity:.78}
.row2{display:flex;gap:10px;align-items:center;margin-top:9px}
.search{flex:1;position:relative;max-width:420px}
.search input{width:100%;height:36px;padding:0 36px 0 34px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font:inherit;font-size:13px;color:var(--text);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(19,122,112,.1)}
.search svg{position:absolute;left:11px;top:11px;color:var(--text-3)}
.search kbd{position:absolute;right:9px;top:9px;font:600 11px var(--font);color:var(--text-3);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface-2)}
.count{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

/* 网格 */
main{width:min(1320px,calc(100% - 36px));margin-inline:auto;padding:18px 0 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{position:relative;border-radius:11px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  cursor:zoom-in;transition:.18s;aspect-ratio:2/3}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cfd5e4}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:#f0f2f7}
.card .tag{position:absolute;left:7px;top:7px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--accent);backdrop-filter:blur(4px)}
.card .no{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:10.5px;color:#fff;
  background:linear-gradient(transparent,rgba(12,16,24,.62));opacity:0;transition:.18s;font-weight:600;letter-spacing:.03em}
.card:hover .no{opacity:1}
.empty{padding:60px 0;text-align:center;color:var(--text-3);font-size:13.5px}
.sentinel{height:1px}

/* 灯箱 */
#lb{position:fixed;inset:0;z-index:60;background:rgba(11,14,20,.94);display:none;
  align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
.lb-inner{display:flex;gap:18px;max-width:100%;max-height:100%;align-items:center}
.lb-fig{max-height:88vh;max-width:min(72vw,720px);border-radius:10px;background:#fff;display:block}
.lb-side{width:210px;color:#cfd4e0;font-size:12.5px;line-height:1.7;flex:none}
.lb-side h4{margin:0 0 4px;font-size:14.5px;color:#fff;font-weight:750;letter-spacing:.02em}
.lb-side .kws{margin:8px 0 14px;color:#9aa3b6;font-size:12px;word-break:break-word}
.lb-side .acts{display:flex;flex-direction:column;gap:8px}
.lb-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;border-radius:9px;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:12.5px;
  font-weight:650;cursor:pointer;transition:.15s;padding:0 12px}
.lb-btn:hover{background:rgba(255,255,255,.18)}
.lb-btn.primary{background:var(--accent);border-color:var(--accent)}
.lb-btn.primary:hover{background:var(--accent-dark)}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);
  color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.nav:hover{background:rgba(255,255,255,.22)}
.nav[disabled]{opacity:.25;cursor:default}
@media (max-width:760px){
  .lb-inner{flex-direction:column;gap:12px}
  .lb-fig{max-width:92vw;max-height:66vh}
  .lb-side{width:min(92vw,420px);text-align:center}
  .lb-side .acts{flex-direction:row;justify-content:center;flex-wrap:wrap}
  .nav{position:absolute;top:50%;transform:translateY(-50%)}
  .nav.prev{left:6px}.nav.next{right:6px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
  .intro{padding-top:18px}
  .count{display:none}
}

footer{width:min(1320px,calc(100% - 36px));margin-inline:auto;padding:22px 0 46px;border-top:1px solid var(--line);
  color:var(--text-3);font-size:12.5px;line-height:1.9}
footer a{color:var(--text-2);border-bottom:1px solid var(--line-strong)}
footer a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="back" href="../">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 19l-7-7 7-7"/></svg>
      总览
    </a>
    <span class="title">衣装参考库<i>COSTUME-DB-01</i></span>
    <span class="spacer"></span>
    <a class="jump" href="../pose/">换到姿势库 →</a>
  </div>
</header>

<section class="intro">
  <h1>1407 套无人衣装图</h1>
  <p class="lede">不含人物、没有脸和背景的服装展示图，保留面料纹理、廓形与配饰细节。按季节与风格分 8 类，支持中文关键词检索，点开可看大图并下载原图。</p>
</section>

<div class="filters">
  <div class="filters-in">
    <div class="chips" id="chips"></div>
    <div class="row2">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜中文或英文：牛仔、蕾丝、dress、SPR-0001" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <span class="count" id="count">加载中…</span>
    </div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
</main>

<div id="lb">
  <button class="nav prev" id="prev" aria-label="上一张">‹</button>
  <div class="lb-inner">
    <img class="lb-fig" id="lbfig" alt="">
    <div class="lb-side">
      <h4 id="lbid">—</h4>
      <div class="kws" id="lbkw"></div>
      <div class="acts">
        <button class="lb-btn primary" id="lbdl">下载原图</button>
        <button class="lb-btn" id="lbopen">新窗口打开</button>
        <button class="lb-btn" id="lbclose">关闭</button>
      </div>
    </div>
  </div>
  <button class="nav next" id="next" aria-label="下一张">›</button>
</div>

<footer>
  <div>图库与原始数据著作权归原作者 <strong>ギア</strong>（<a href="https://x.com/giaaibusi" target="_blank" rel="noopener">@giaaibusi</a>）所有，原站 <a href="https://ai-costume-gallery.pages.dev/" target="_blank" rel="noopener">ai-costume-gallery.pages.dev</a>。本站仅为便于中文检索与离线参考的托管镜像，不对图片主张任何权利。</div>
  <div>若原作者认为本页不妥，请通过 <a href="https://github.com/JasonBour/pose-costume-gallery-zh/issues" target="_blank" rel="noopener">Issue</a> 联系，将立即下线。</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const CATS = ["春","夏","秋","冬","内衣","性感","泳装","派对"];
let all = [], view = [], shown = 0, cur = -1;
const BATCH = 120;

/* 分类 chips */
function buildChips(){
  const cnt = {};
  all.forEach(r => cnt[r.cat] = (cnt[r.cat] || 0) + 1);
  const box = $('#chips');
  const mk = (label, val, n) => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.cat === val ? ' on' : '');
    b.innerHTML = label + (n != null ? '<b>' + n + '</b>' : '');
    b.onclick = () => { state.cat = val; buildChips(); apply(); };
    box.appendChild(b);
  };
  box.innerHTML = '';
  mk('全部', '', all.length);
  CATS.forEach(c => { if (cnt[c]) mk(c, c, cnt[c]); });
}

const state = { cat: '', q: '' };

/* 渲染 */
function apply(){
  const q = state.q.trim().toLowerCase();
  view = all.filter(r => {
    if (state.cat && r.cat !== state.cat) return false;
    if (!q) return true;
    return (r.id + ' ' + r.cat + ' ' + r.zh + ' ' + r.kw).toLowerCase().includes(q);
  });
  $('#count').textContent = view.length + ' / ' + all.length + ' 套';
  $('#grid').innerHTML = '';
  shown = 0;
  if (!view.length){
    $('#grid').innerHTML = '<div class="empty">没有匹配的衣装，换个词试试</div>';
    return;
  }
  paint();
}

function paint(){
  const frag = document.createDocumentFragment();
  const end = Math.min(shown + BATCH, view.length);
  for (let i = shown; i < end; i++){
    const r = view[i];
    const d = document.createElement('div');
    d.className = 'card';
    d.dataset.i = i;
    d.innerHTML = '<img loading="lazy" src="' + r.thumb + '" alt="' + r.zh + '">'
                + '<span class="tag">' + r.cat + '</span>'
                + '<span class="no">' + r.id + '</span>';
    d.onclick = () => openAt(i);
    frag.appendChild(d);
  }
  $('#grid').appendChild(frag);
  shown = end;
}

/* 滚动加载 */
const io = new IntersectionObserver(es => {
  if (es[0].isIntersecting && shown < view.length) paint();
}, { rootMargin: '600px' });
io.observe($('#sentinel'));

/* 灯箱 */
function openAt(i){
  if (i < 0 || i >= view.length) return;
  cur = i;
  const r = view[i];
  const fig = $('#lbfig');
  fig.src = r.thumb;
  const full = new Image();
  full.onload = () => { fig.src = r.img; };
  full.src = r.img;
  $('#lbid').textContent = r.id + ' · ' + r.cat;
  $('#lbkw').textContent = r.zh + '　｜　' + r.kw;
  $('#prev').disabled = i === 0;
  $('#next').disabled = i === view.length - 1;
  $('#lb').classList.add('on');
}
function closeLb(){ $('#lb').classList.remove('on'); }

$('#lbdl').onclick = () => {
  const r = view[cur]; if (!r) return;
  const a = document.createElement('a');
  a.href = r.img; a.download = r.id + '.webp';
  document.body.appendChild(a); a.click(); a.remove();
};
$('#lbopen').onclick = () => { const r = view[cur]; if (r) window.open(r.img, '_blank'); };
$('#lbclose').onclick = closeLb;
$('#prev').onclick = () => openAt(cur - 1);
$('#next').onclick = () => openAt(cur + 1);
$('#lb').onclick = e => { if (e.target.id === 'lb') closeLb(); };

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openAt(cur - 1);
  if (e.key === 'ArrowRight') openAt(cur + 1);
});

/* 输入防抖 */
let t;
$('#q').oninput = e => {
  clearTimeout(t);
  t = setTimeout(() => { state.q = e.target.value; apply(); }, 160);
};

/* 载入 */
fetch('data/costume.json')
  .then(r => r.json())
  .then(d => {
    all = d;
    buildChips();
    apply();
  })
  .catch(e => {
    $('#count').textContent = '数据加载失败';
    $('#grid').innerHTML = '<div class="empty">数据没加载出来，刷新一次试试</div>';
  });
</script>
</body>
